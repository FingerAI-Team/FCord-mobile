<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#fcf8fa",
                        "background-light": "#FFFFFF",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#c0c6db",
                        "surface-variant": "#e5e2e3",
                        "surface-container-highest": "#e5e2e3",
                        "error": "#ba1a1a",
                        "accent-blue": "#2563EB",
                        "surface-tint": "#575e70",
                        "on-error": "#ffffff",
                        "danger-red": "#DC2626",
                        "secondary-fixed-dim": "#c0c7d6",
                        "outline": "#76777d",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dce2f7",
                        "primary": "#000000",
                        "primary-fixed-dim": "#c0c6db",
                        "on-primary-fixed-variant": "#404758",
                        "on-tertiary-fixed-variant": "#55442d",
                        "tertiary-fixed": "#f9debf",
                        "text-primary-dark": "#F9FAFB",
                        "surface-elevated-dark": "#1F2937",
                        "on-primary-container": "#7d8497",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f6f3f4",
                        "tertiary-fixed-dim": "#dcc2a4",
                        "secondary-fixed": "#dce2f3",
                        "on-primary-fixed": "#141b2b",
                        "recording-red": "#EF4444",
                        "background-dark": "#0B0F19",
                        "surface": "#fcf8fa",
                        "inverse-on-surface": "#f3f0f1",
                        "surface-dark": "#111827",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c6c6cd",
                        "border-light": "#E5E7EB",
                        "surface-bright": "#fcf8fa",
                        "tertiary": "#000000",
                        "on-tertiary-container": "#968065",
                        "on-surface": "#1b1b1d",
                        "on-secondary-fixed-variant": "#404754",
                        "text-primary-light": "#111827",
                        "primary-container": "#141b2b",
                        "secondary": "#585f6c",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#261906",
                        "warning-amber": "#F59E0B",
                        "surface-dim": "#dcd9db",
                        "on-secondary-container": "#5e6572",
                        "surface-container-high": "#eae7e9",
                        "secondary-container": "#dce2f3",
                        "accent-blue-dark": "#60A5FA",
                        "inverse-surface": "#303031",
                        "surface-container": "#f0edee",
                        "on-secondary-fixed": "#151c27",
                        "on-tertiary-fixed": "#261906",
                        "success-green": "#10B981",
                        "border-dark": "#1F2937",
                        "on-background": "#1b1b1d",
                        "on-surface-variant": "#45464c",
                        "surface-light": "#F9FAFB",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "2xl": "32px",
                        "xs": "4px",
                        "xl": "24px",
                        "md": "12px",
                        "3xl": "48px",
                        "lg": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label": ["Hanken Grotesk"],
                        "caption": ["Hanken Grotesk"],
                        "body": ["Hanken Grotesk"],
                        "heading": ["Hanken Grotesk"],
                        "display": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label": ["13px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "caption": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                        "body": ["15px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "heading": ["20px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "display": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.5px", "fontWeight": "800"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background dark:bg-background-dark text-on-surface transition-colors duration-300 min-h-screen flex flex-col items-center justify-between selection:bg-primary/10">
<!-- Header / Navigation Control -->
<header class="w-full flex justify-end items-center px-lg h-16 max-w-screen-xl mx-auto">
<button class="text-secondary dark:text-outline font-label text-label transition-colors hover:opacity-80 active:scale-95 duration-200">
            건너뛰기
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-md px-xl flex flex-col items-center">
<!-- Hero Section -->
<section class="mt-3xl mb-xl flex flex-col items-center text-center">
<div class="w-24 h-24 mb-3xl flex items-center justify-center bg-surface-container-low dark:bg-surface-elevated-dark rounded-xl">
<span class="material-symbols-outlined text-[64px] text-primary dark:text-text-primary-dark" style="font-variation-settings: 'wght' 200;">face</span>
</div>
<h1 class="font-display text-display text-primary dark:text-text-primary-dark mb-lg tracking-tight">
                Face ID로 빠르게 로그인
            </h1>
<p class="font-body text-body text-secondary dark:text-on-secondary-container leading-relaxed px-md">
                생체 정보는 기기에 안전하게 저장되며, 앱 세션 잠금 해제 용도로만 사용됩니다. 정보는 외부로 전송되지 않습니다.
            </p>
</section>
<!-- Reassurance Banner -->
<div class="flex items-center gap-xs bg-surface-container-low dark:bg-surface-elevated-dark px-md py-sm rounded-full mb-2xl">
<span class="material-symbols-outlined text-[18px] text-success-green" style="font-variation-settings: 'FILL' 1;">
                lock
            </span>
<span class="font-label text-label text-on-surface-variant dark:text-outline-variant">
                사내 보안 정책 준수
            </span>
</div>
<!-- Decorative Element (Bento-style detail) -->
<div class="w-full grid grid-cols-2 gap-md opacity-50 dark:opacity-30">
<div class="h-1 bg-surface-variant dark:bg-surface-elevated-dark rounded-full"></div>
<div class="h-1 bg-surface-variant dark:bg-surface-elevated-dark rounded-full"></div>
</div>
</main>
<!-- Fixed Action Drawer at Bottom -->
<footer class="w-full max-w-md px-xl pb-3xl pt-xl flex flex-col gap-md">
<!-- Primary Action -->
<button class="w-full h-[52px] bg-primary dark:bg-primary-fixed text-on-primary dark:text-on-primary-fixed font-heading text-heading rounded-xl shadow-sm transition-all hover:opacity-90 active:scale-[0.98] flex items-center justify-center gap-sm">
            사용하기
        </button>
<!-- Secondary/Tertiary Action -->
<button class="w-full h-[52px] bg-transparent text-secondary dark:text-outline font-label text-label rounded-xl transition-all hover:bg-surface-container-low dark:hover:bg-surface-elevated-dark active:scale-[0.98] flex items-center justify-center">
            지금은 안 함
        </button>
</footer>
<!-- Invisible Backdrop / Texture -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-accent-blue/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-recording-red/5 rounded-full blur-[80px]"></div>
</div>
</body></html>
