<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>IBK STT - Active Recording</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "recording-red": "#EF4444",
                        "on-tertiary-fixed-variant": "#55442d",
                        "on-background": "#1b1b1d",
                        "surface-elevated-dark": "#1F2937",
                        "on-primary-fixed-variant": "#404758",
                        "surface-light": "#F9FAFB",
                        "primary-fixed-dim": "#c0c6db",
                        "border-dark": "#1F2937",
                        "inverse-primary": "#c0c6db",
                        "background-light": "#FFFFFF",
                        "surface-container": "#f0edee",
                        "primary-container": "#141b2b",
                        "danger-red": "#DC2626",
                        "accent-blue": "#2563EB",
                        "surface-dark": "#111827",
                        "on-error": "#ffffff",
                        "surface-variant": "#e5e2e3",
                        "on-surface-variant": "#45464c",
                        "text-primary-dark": "#F9FAFB",
                        "secondary-fixed-dim": "#c0c7d6",
                        "surface": "#fcf8fa",
                        "surface-container-highest": "#e5e2e3",
                        "outline-variant": "#c6c6cd",
                        "secondary-fixed": "#dce2f3",
                        "on-tertiary-container": "#968065",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f6f3f4",
                        "inverse-surface": "#303031",
                        "tertiary": "#000000",
                        "secondary-container": "#dce2f3",
                        "on-tertiary-fixed": "#261906",
                        "on-primary-fixed": "#141b2b",
                        "on-primary-container": "#7d8497",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#261906",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#5e6572",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "warning-amber": "#F59E0B",
                        "error": "#ba1a1a",
                        "on-surface": "#1b1b1d",
                        "tertiary-fixed": "#f9debf",
                        "primary": "#000000",
                        "surface-container-high": "#eae7e9",
                        "secondary": "#585f6c",
                        "inverse-on-surface": "#f3f0f1",
                        "surface-dim": "#dcd9db",
                        "border-light": "#E5E7EB",
                        "success-green": "#10B981",
                        "primary-fixed": "#dce2f7",
                        "on-secondary-fixed-variant": "#404754",
                        "tertiary-fixed-dim": "#dcc2a4",
                        "background-dark": "#0B0F19",
                        "text-primary-light": "#111827",
                        "on-secondary-fixed": "#151c27",
                        "accent-blue-dark": "#60A5FA",
                        "surface-bright": "#fcf8fa",
                        "surface-tint": "#575e70",
                        "background": "#fcf8fa",
                        "outline": "#76777d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "3xl": "48px",
                        "lg": "16px",
                        "xl": "24px",
                        "md": "12px",
                        "xs": "4px",
                        "2xl": "32px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body": ["Hanken Grotesk"],
                        "caption": ["Hanken Grotesk"],
                        "heading": ["Hanken Grotesk"],
                        "display": ["Hanken Grotesk"],
                        "label": ["Hanken Grotesk"],
                        "mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body": ["15px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "caption": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                        "heading": ["20px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "display": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.5px", "fontWeight": "800"}],
                        "label": ["13px", {"lineHeight": "1.2", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .waveform-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 120px;
        }
        .bar {
            width: 3px;
            border-radius: 2px;
            background-color: #111827; /* Near black */
        }
        /* Simulated heights for static representation */
        .bar-1 { height: 20%; }
        .bar-2 { height: 45%; }
        .bar-3 { height: 70%; }
        .bar-4 { height: 35%; }
        .bar-5 { height: 90%; }
        .bar-6 { height: 60%; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark font-body min-h-screen flex flex-col transition-colors duration-300">
<!-- Top Navigation Bar (Custom Shell) -->
<header class="w-full top-0 sticky z-50 flex items-center justify-between px-lg h-16 bg-background-light dark:bg-background-dark">
<button class="w-10 h-10 flex items-center justify-start active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-text-primary-dark">close</span>
</button>
<div class="flex-grow text-center">
<span class="font-mono text-display text-primary dark:text-text-primary-dark tracking-tighter">00:12:34</span>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex flex-col items-center px-xl pt-2xl">
<!-- Waveform Visualization -->
<div class="w-full mb-3xl">
<div class="waveform-container overflow-hidden opacity-80 dark:opacity-60">
<!-- Static Waveform Bars -->
<div class="bar bar-1 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-2 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-3 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-4 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-5 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-6 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-4 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-2 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-3 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-5 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-6 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-4 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-1 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-3 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-5 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-2 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-4 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-6 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-1 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-4 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-5 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-2 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-3 bg-primary dark:bg-accent-blue-dark"></div>
<div class="bar bar-1 bg-primary dark:bg-accent-blue-dark"></div>
</div>
</div>
<!-- dB Meter -->
<div class="flex flex-col items-center gap-sm mb-3xl">
<div class="flex items-center gap-md">
<div class="w-32 h-1 bg-border-light dark:bg-border-dark rounded-full overflow-hidden">
<div class="h-full bg-success-green w-3/4 rounded-full"></div>
</div>
<span class="font-mono text-label text-primary dark:text-text-primary-dark">-12 dB</span>
</div>
<span class="font-label text-caption text-secondary">입력 레벨</span>
</div>
<!-- Note Input Area -->
<div class="w-full max-w-md space-y-sm">
<label class="font-label text-caption text-secondary px-xs">빠른 메모</label>
<div class="relative flex items-center">
<input class="w-full h-14 px-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark rounded-xl focus:ring-2 focus:ring-accent-blue focus:outline-none transition-all dark:text-text-primary-dark placeholder:text-outline" placeholder="녹음 중 메모하기..." type="text"/>
<button class="absolute right-md p-sm text-primary dark:text-text-primary-dark">
<span class="material-symbols-outlined">add_circle</span>
</button>
</div>
</div>
</main>
<!-- Bottom Controls Shell -->
<footer class="fixed bottom-0 w-full bg-background-light dark:bg-background-dark px-xl pb-10 pt-lg">
<div class="flex flex-col items-center gap-lg">
<div class="flex items-center justify-center gap-3xl">
<!-- Pause Button -->
<button class="w-14 h-14 rounded-full bg-surface-container dark:bg-surface-elevated-dark flex items-center justify-center text-primary dark:text-text-primary-dark active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<!-- Stop Button -->
<div class="relative">
<button class="w-20 h-20 rounded-full bg-recording-red flex items-center justify-center text-white shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">stop</span>
</button>
</div>
</div>
<span class="font-label text-caption text-secondary">탭하여 정지</span>
</div>
</footer>
<!-- Background Decoration for Depth -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full -z-10 opacity-5 pointer-events-none">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-accent-blue via-transparent to-transparent"></div>
</div>
</body></html>
