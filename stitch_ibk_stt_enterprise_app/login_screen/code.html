<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col antialiased">
<!-- Top Navigation Bar (Suppressed labels/icons as per Transactional rule, only Brand remains) -->
<header class="fixed top-0 left-0 w-full z-50 bg-background-light dark:bg-background-dark flex justify-between items-center px-lg py-md h-16">
<div class="font-display text-heading font-extrabold text-primary dark:text-primary-fixed">VocalLog</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container dark:bg-surface-elevated-dark flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-sm">person</span>
</div>
</header>
<main class="flex-1 flex flex-col px-xl pt-[176px] max-w-md mx-auto w-full">
<!-- Brand & Heading Section -->
<section class="mb-3xl text-center md:text-left">
<span class="font-label text-label tracking-widest text-secondary dark:text-on-secondary-fixed-variant block mb-sm">IBK STT</span>
<h1 class="font-display text-display text-on-surface dark:text-text-primary-dark mb-md">로그인</h1>
<p class="font-body text-body text-secondary dark:text-on-secondary-fixed-variant">사내 SSO 계정으로 시작하세요</p>
</section>
<!-- Primary Action Section -->
<section class="space-y-xl">
<button class="w-full h-[52px] bg-primary dark:bg-primary-fixed text-on-primary dark:text-on-primary-fixed font-heading rounded-full shadow-sm active:scale-[0.98] transition-transform flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock</span>
                IBK SSO로 로그인
            </button>
<p class="font-caption text-caption text-secondary dark:text-on-secondary-fixed-variant text-center px-lg">
                현재 가상 SSO로 동작합니다. IBK투자증권 SSO 사양 수령 후 자동 전환됩니다.
            </p>
</section>
<!-- Divider -->
<div class="relative flex items-center my-3xl">
<div class="flex-grow border-t border-border-light dark:border-border-dark"></div>
<span class="flex-shrink mx-md font-caption text-caption text-secondary dark:text-on-secondary-fixed-variant">또는 사번으로 로그인</span>
<div class="flex-grow border-t border-border-light dark:border-border-dark"></div>
</div>
<!-- Toggle & Fallback Form -->
<section class="flex flex-col items-center">
<button class="font-label text-label text-accent-blue dark:text-accent-blue-dark mb-2xl hover:opacity-80 transition-opacity">
                사번 로그인 열기
            </button>
<!-- Fallback Form (Visualized in expanded state for the design) -->
<div class="w-full space-y-md">
<div class="relative group">
<input class="peer w-full h-14 bg-surface-container-low dark:bg-surface-elevated-dark border-none rounded-xl px-lg pt-4 font-body text-on-surface dark:text-text-primary-dark focus:ring-2 focus:ring-accent-blue dark:focus:ring-accent-blue-dark transition-all" placeholder=" " type="text"/>
<label class="absolute left-lg top-1/2 -translate-y-1/2 font-body text-secondary dark:text-on-secondary-fixed-variant transition-all pointer-events-none peer-focus:top-3 peer-focus:text-[10px] peer-[:not(:placeholder-shown)]:top-3 peer-[:not(:placeholder-shown)]:text-[10px]">사번</label>
</div>
<div class="relative group">
<input class="peer w-full h-14 bg-surface-container-low dark:bg-surface-elevated-dark border-none rounded-xl px-lg pt-4 font-body text-on-surface dark:text-text-primary-dark focus:ring-2 focus:ring-accent-blue dark:focus:ring-accent-blue-dark transition-all" placeholder=" " type="password"/>
<label class="absolute left-lg top-1/2 -translate-y-1/2 font-body text-secondary dark:text-on-secondary-fixed-variant transition-all pointer-events-none peer-focus:top-3 peer-focus:text-[10px] peer-[:not(:placeholder-shown)]:top-3 peer-[:not(:placeholder-shown)]:text-[10px]">비밀번호</label>
</div>
<button class="w-full h-[52px] bg-secondary-container dark:bg-secondary-fixed-dim text-on-secondary-container dark:text-on-secondary-fixed-variant font-heading rounded-xl mt-lg active:scale-[0.98] transition-transform">
                    로그인
                </button>
</div>
</section>
<!-- Decorative Subtle Accent (Optional Visual Flourish) -->
<div class="mt-auto py-3xl flex justify-center opacity-20 grayscale pointer-events-none">
<div class="w-16 h-1 bg-border-light dark:bg-border-dark rounded-full"></div>
</div>
</main>
